<!DOCTYPE html>
<html>

<head>
    <title>Vote</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <h2><img id="app-icon" src="/img/app-icon.jpg" alt="App img">Voting System</h2>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="vote.html">Vote</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="results.html">Results</a>
            <a href="admin-login.html" id="adminLink">Admin</a>
        </div>
        <div class="nav-info">
            <span id="navStatus"></span>
            <span id="navUser"></span>
            <button id="logoutBtn" style="display:none;" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <h2>Cast Your Vote</h2>

        <div class="control-unit">
            <h3>Control Unit</h3>
            <div class="control-buttons">
                <div class="control-item">
                    <div class="control-led" id="powerLED"></div><button disabled>Power</button>
                </div>
                <div class="control-item">
                    <div class="control-led" id="ballotLED"></div><button id="ballotBtn"
                        onclick="enableBallot()">Ballot</button>
                </div>
                <div class="control-item">
                    <div class="control-led" id="closeLED"></div><button id="closeBtn"
                        onclick="closeVoting()">Close</button>
                </div>
                <div class="control-item">
                    <div class="control-led" id="busyLED"></div><button disabled>Busy</button>
                </div>
            </div>
        </div>

        <div class="evm-container">
            <div class="machine-label">
                <h4>Election Commission of India</h4><span>Ballot Unit - BU-2026</span>
            </div>
            <br>
            <div class="evm-body">

                <div class="candidate-panel" id="candidateList"> ... </div>
                <div class="button-panel" id="buttonPanel"> ... </div>
            </div>
        </div>
        <br><br><button onclick="window.location.href='results.html'" class="resultbtn">View Results</button>

    </div>
    </div>

    </div>

    <div id="voteSuccessOverlay" class="overlay">
        <div class="overlay-content">
            <div class="checkmark">✔</div>
            <h2>Vote Successfully Recorded!</h2>
        </div>
    </div>

    <script src="./js/navbar.js"></script>

    <!-- 1️⃣ ethers FIRST -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

    <!-- 2️⃣ blockchain (uses ethers) -->
    <script src="./js/blockchain.js"></script>

    <!-- 3️⃣ vote.js (uses blockchain functions) -->
    <script src="./js/vote.js"></script>

    <audio id="evmBeep" src="https://www.soundjay.com/buttons/sounds/beep-07.mp3"></audio>

    <!-- AI Chatbot Widget -->
    <%- include('chat-snippet.html') %>


</body>

</html>
