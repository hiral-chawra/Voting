<!DOCTYPE html>
<html>

<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <h2><img id="app-icon" src="/img/app-icon.jpg" alt="App img">Digital Voting System of India</h2>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#" onclick="goToVoting()">Vote</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="results.html">Results</a>
            <a href="admin-login.html" id="adminLink">Admin</a>
        </div>
        <div class="nav-info">
            <span id="navStatus"></span>
            <span id="navUser"></span>
            <button id="logoutBtn" style="display:none;" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <h2>Election Management Panel</h2>
        <hr>

        <h3>Election Control</h3>
        <div class="election-controls" style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <span id="statusBadge" class="status-badge">Not Started</span>

            <!-- Sleek inline inputs for Blockchain Proposal -->
            <input type="text" id="bcElectionName" placeholder="Election Name"
                style="margin-bottom: 0; width: auto; flex: 1;">
            <input type="number" id="bcElectionDuration" placeholder="Duration (Mins)"
                style="margin-bottom: 0; width: 150px;">
            <button onclick="createElectionUI()" style="white-space: nowrap;">Propose to Blockchain</button>
        </div>
        <hr>

        <h3>Pending Election Proposals</h3>
        <div id="proposalList"></div>
        <hr>
        <h3>Add Political Party</h3>
        <form id="partyForm"></form>
        <hr>
        <h3>Create Constituency</h3>
        <form id="constituencyForm"></form>
        <hr>
        <h3>Add Candidate</h3>
        <form id="candidateForm"></form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="./js/blockchain.js"></script>
    <script src="./js/navbar.js"></script>
    <script src="./js/admin.js"></script>
</body>

</html>
