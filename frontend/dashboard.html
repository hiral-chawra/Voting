<!DOCTYPE html>
<html>

<head>
    <title>Election Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <h2><img id="app-icon" src="/img/app-icon.jpg" alt="App img">Digital Voting System of India</h2>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#" onclick="goToVoting()">Vote</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="results.html">Results</a>
            <a href="admin-login.html" id="adminLink">Admin</a>
        </div>
        <div class="nav-info">
            <span id="navStatus"></span>
            <span id="navUser"></span>
            <button id="logoutBtn" style="display:none;" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <h2>Election Dashboard</h2>
        <div class="dashboard-grid">
            <h2 id="resultHeading" style="margin-top:50px;">Candidate Results</h2>
            <div id="resultsTimestamp" class="results-timestamp" style="display:none;"></div>
            <div id="candidateResults" class="results-panel" style="display:none;"></div>

            <div class="dashboard-card">
                <h3>Total Registered Voters</h3>
                <p id="totalVoters">0</p>
            </div>
            <div class="dashboard-card">
                <h3>Votes Cast</h3>
                <p id="votesCast">0</p>
            </div>
            <div class="dashboard-card">
                <h3>Turnout Percentage</h3>
                <p id="turnout">0%</p>
            </div>
            <div class="dashboard-card">
                <h3>Election Status</h3>
                <p id="electionStatus">Managed by Admin</p>
            </div>
        </div>
    </div>

    <script src="./js/navbar.js"></script>
    <script src="./js/dashboard.js"></script>

    <!-- AI Chatbot Widget -->
    <%- include('chat-snippet.html') %>

</body>

</html>
