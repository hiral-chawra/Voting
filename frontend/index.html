<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Digital Voting System of India</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <nav class="navbar">
    <h2><img id="app-icon" src="/img/app-icon.jpg" alt="App img">Digital Voting System of India</h2>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="#" onclick="goToVoting()">Vote</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="results.html">Results</a>
      <a href="admin-login.html" id="adminLink">Admin</a>
    </div>
    <div class="nav-info">
      <span id="navStatus"></span>
      <span id="navUser"></span>
      <button id="logoutBtn" style="display:none;" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container">
    <h1>Digital Voting System of India</h1>
    <p>Secure • Transparent • One Citizen One Vote</p>
    <p style="font-size: 0.9rem; margin-top:10px;">Prototype for Election Commission of India</p>
    <button onclick="goToVote()">Start Voting</button>
  </div>

  <script>
    function goToVote() { window.location.href = "language.html"; }
  </script>
  <script src="./js/navbar.js"></script>

  <!-- AI Chatbot Widget -->
  <div id="chatToggle" onclick="toggleChat()">🤖</div>

  <div id="chatWindow" style="display:none;">
    <div id="chatHeader">
      Hi! 👋<br>
      <small>AI Voting Assistant</small>
    </div>
    <div id="chatMessages">
      <div class="ai-msg">
        Hi 👋 I'm your AI Voting Assistant.<br>
        Ask me anything about voting!
      </div>
    </div>
    <div id="chatInputArea">
      <input id="chatInput" placeholder="Ask something..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
  <script src="./js/ai.js"></script>

</body>

</html>
