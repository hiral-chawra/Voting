<!DOCTYPE html>
<html>

<head>
  <title>Select Language</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="navbar">
    <h2><img id="app-icon" src="/img/app-icon.jpg" alt="App img">Digital Voting System of India</h2>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="#" onclick="goToVoting()">Vote</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="results.html">Results</a>
      <a href="admin-login.html" id="adminLink">Admin</a>
    </div>
    <div class="nav-info">
      <span id="navStatus"></span>
      <span id="navUser"></span>
      <button id="logoutBtn" style="display:none;" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container">
    <h2>Select Your Language</h2>
    <p style="font-size:0.9rem; color:#6B7280;">This preference is used throughout the voting flow.</p>

    <select id="languageSelect" style="width:100%; padding:12px; border-radius:6px; border:1px solid #d1d5db;">
      <option value="en">English</option>
      <option value="hi">हिंदी</option>
      <option value="ta">தமிழ்</option>
      <option value="bn">বাংলা</option>
      <option value="te">తెలుగు</option>
      <option value="mr">मराठी</option>
      <option value="kn">ಕನ್ನಡ</option>
      <option value="gu">ગુજરાતી</option>
    </select>

    <br><br>
    <button onclick="continueToVerify()">Continue</button>
  </div>

  <script src="./js/navbar.js"></script>
  <script>
    const KEY = "language";
    document.getElementById("languageSelect").value = localStorage.getItem(KEY) || "en";

    function continueToVerify() {
      localStorage.setItem(KEY, document.getElementById("languageSelect").value);
      window.location.href = "verify.html";
    }
  </script>
</body>

</html>
